name: Retry staff request alerts
on:
  schedule:
    # Offset from the top of the hour; GitHub may still delay scheduled runs.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production-request-alerts
  cancel-in-progress: false
jobs:
  retry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout or third-party action receives the production credential.
      - name: Process production alert queue
        env:
          CRON_SECRET: ${{ secrets.REQUEST_ALERTS_CRON_SECRET }}
        run: |
          node <<'NODE'
          (async () => {
            if (!process.env.CRON_SECRET) throw new Error('Retry credential is missing');
            const response = await fetch(
              'https://journey-support-pass.vercel.app/api/cron/request-alerts',
              {
                headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET },
                redirect: 'error',
                signal: AbortSignal.timeout(45000),
              },
            );
            if (!response.ok) throw new Error('Retry endpoint returned HTTP ' + response.status);
            const result = await response.json();
            if (result.enabled !== true || !Number.isInteger(result.attempted))
              throw new Error('Push configuration unavailable or unexpected retry response');
            console.log('Push queue processed; attempted deliveries: ' + result.attempted);
          })().catch(() => {
            console.error('Production alert retry failed. Check endpoint health and retry configuration.');
            process.exitCode = 1;
          });
          NODE
